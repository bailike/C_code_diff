<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Diff Tool</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  background: #ffffff;
  color: #1a1a1a;
  height: 100vh;
  overflow: hidden;
  display: flex; flex-direction: column;
}

/* ========== Toolbar ========== */
#toolbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: #f0f0f0; border-bottom: 1px solid #d0d0d0;
  flex-shrink: 0; flex-wrap: wrap; min-height: 36px;
}
#toolbar button {
  padding: 4px 10px; border: 1px solid #bbb; border-radius: 3px;
  background: #fff; color: #333; cursor: pointer; font-size: 12px;
  white-space: nowrap;
}
#toolbar button:hover { background: #e8e8e8; }
#toolbar button.active { background: #0066cc; border-color: #0066cc; color: #fff; }
#toolbar button:disabled { opacity: 0.4; cursor: default; }
#toolbar .sep { width: 1px; height: 20px; background: #d0d0d0; margin: 0 4px; flex-shrink: 0; }
#toolbar label { font-size: 12px; color: #555; display: flex; align-items: center; gap: 3px; cursor: pointer; white-space: nowrap; }
#toolbar input[type="checkbox"] { cursor: pointer; }
#diffCount { font-size: 12px; color: #666; min-width: 80px; text-align: center; font-weight: bold; }

/* ========== Search Bars ========== */
#searchRow {
  display: flex; gap: 0; flex-shrink: 0; background: #f5f5f5;
  border-bottom: 1px solid #d0d0d0;
}
.searchBar {
  flex: 1; display: flex; align-items: center; gap: 4px;
  padding: 4px 8px; font-size: 12px;
}
.searchBar:first-child { border-right: 1px solid #d0d0d0; }
.searchBar input[type="text"] {
  flex: 1; min-width: 80px; padding: 3px 6px; border: 1px solid #ccc;
  border-radius: 3px; background: #fff; color: #1a1a1a; font-family: inherit;
  font-size: 12px;
}
.searchBar input[type="text"]:focus { outline: none; border-color: #0066cc; }
.searchBar button {
  padding: 2px 6px; border: 1px solid #bbb; border-radius: 3px;
  background: #fff; color: #333; cursor: pointer; font-size: 11px;
}
.searchBar button:hover { background: #e8e8e8; }
.searchBar button.active { background: #0066cc; color: #fff; }
.searchBar label { display: flex; align-items: center; gap: 2px; font-size: 11px; color: #888; white-space: nowrap; }
.searchBar .count { font-size: 11px; color: #888; min-width: 60px; text-align: right; }
.searchBar .count.hasResults { color: #0066cc; }

/* ========== Main Panels ========== */
#panelsContainer {
  flex: 1; display: flex; overflow: hidden; position: relative;
  background: #fff;
}
.panelWrapper {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  position: relative;
}
.panelWrapper:first-child { border-right: 2px solid #d0d0d0; }
.panelHeader {
  padding: 3px 10px; background: #f5f5f5; font-size: 11px; color: #666;
  border-bottom: 1px solid #d0d0d0; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
.panelContent {
  flex: 1; overflow: auto; position: relative;
  font-family: 'Consolas', 'Courier New', monospace; font-size: 14px;
  line-height: 20px; background: #fff;
}
.panelContent::-webkit-scrollbar { width: 10px; height: 10px; }
.panelContent::-webkit-scrollbar-track { background: #f0f0f0; }
.panelContent::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 5px; }
.panelContent::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }
.panelContent::-webkit-scrollbar-corner { background: #f0f0f0; }

/* ========== Code Table ========== */
.codeTable { border-collapse: collapse; table-layout: fixed; width: 100%; }
.codeTable col.lineNum { width: 55px; }
.codeTable td {
  padding: 0 4px; white-space: pre; line-height: 20px;
  height: 20px; vertical-align: top;
}
.codeTable .ln {
  text-align: right; color: #999; padding-right: 10px;
  cursor: pointer; user-select: none; border-right: 1px solid #e0e0e0;
  min-width: 55px; background: #fafafa;
}
.codeTable .ln:hover { color: #333; background: #e8e8e8; }
.codeTable .code {
  color: #1a1a1a; overflow: hidden; text-overflow: clip; padding-left: 8px;
  user-select: text; cursor: text;
}
.codeTable .spacer { height: 20px; }

/* ========== Diff Highlighting ========== */
tr.diffSame { }
tr.diffAdded .code { background: #e6ffe6; }
tr.diffRemoved .code { background: #ffe6e6; }
tr.diffModified .code { background: #ffffd0; }
tr.diffCurrent { outline: 2px solid #0066cc; outline-offset: -2px; }
tr.diffAdded .ln { background: #d4f0d4; }
tr.diffRemoved .ln { background: #f0d4d4; }
tr.diffModified .ln { background: #f0f0c0; }

/* Character-level diff */
.charAdded { background: #90ee90; border-radius: 2px; }
.charRemoved { background: #ffb0b0; border-radius: 2px; text-decoration: line-through; }
.charModified { background: #f0f0a0; border-radius: 2px; }

/* ========== Selection ========== */
tr.rowSelected td.code { background: #cce0ff !important; }
tr.rowSelected td.ln { background: #b0d0f0 !important; color: #0066cc; font-weight: bold; }

/* ========== Search Highlighting ========== */
mark.searchMatch { background: #ffa500; color: #000; border-radius: 2px; padding: 0 1px; }
mark.searchCurrent { background: #ff8800; color: #000; border-radius: 2px; padding: 0 1px; outline: 2px solid #cc4400; }

/* ========== Fold Lines ========== */
tr.foldRowSame { cursor: pointer; }
tr.foldRowSame td {
  color: #888; text-align: center; padding: 5px 0;
  background: #f8f8f8; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc;
  font-size: 12px;
}
tr.foldRowSame:hover td { color: #333; background: #eee; }
tr.foldRowSame .foldText { font-style: italic; }

tr.foldRowDiff { cursor: pointer; }
tr.foldRowDiff td {
  color: #996600; text-align: center; padding: 5px 0;
  background: #fffde6; border-top: 1px solid #e0c000; border-bottom: 1px solid #e0c000;
  font-size: 12px;
}
tr.foldRowDiff:hover td { color: #664400; background: #fff9cc; }
tr.foldRowDiff .foldText { font-style: italic; }

/* ========== Region Diff Panel ========== */
#regionPanel {
  display: none; flex-direction: column; border-top: 3px solid #0066cc;
  height: 200px; min-height: 80px; flex-shrink: 0; background: #fff;
  position: relative;
}
#regionPanel.visible { display: flex; }
#regionPanel .panelContent { flex: 1; overflow: auto; }
#regionResizer {
  position: absolute; top: -6px; left: 0; right: 0; height: 10px;
  cursor: row-resize; z-index: 20;
}
#regionResizer:hover { background: rgba(0,102,204,0.2); }

/* ========== Status Bar ========== */
#statusBar {
  display: flex; gap: 16px; padding: 3px 10px; background: #0066cc;
  color: #fff; font-size: 11px; flex-shrink: 0; align-items: center;
}
#statusBar span { white-space: nowrap; }

/* ========== Dialogs ========== */
.dialogOverlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center;
  align-items: center;
}
.dialogOverlay.visible { display: flex; }
.dialogBox {
  background: #fff; border: 1px solid #ccc; border-radius: 6px;
  padding: 20px; min-width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.dialogBox h3 { margin-bottom: 12px; color: #333; font-size: 14px; }
.dialogBox input[type="text"], .dialogBox input[type="number"], .dialogBox select {
  width: 100%; padding: 6px 10px; margin-bottom: 10px; border: 1px solid #ccc;
  border-radius: 3px; background: #fff; color: #1a1a1a; font-family: inherit;
  font-size: 13px;
}
.dialogBox input:focus, .dialogBox select:focus { outline: none; border-color: #0066cc; }
.dialogBtns { display: flex; gap: 8px; justify-content: flex-end; }
.dialogBtns button {
  padding: 6px 16px; border: 1px solid #bbb; border-radius: 3px;
  background: #fff; color: #333; cursor: pointer; font-size: 12px;
}
.dialogBtns button.primary { background: #0066cc; border-color: #0066cc; color: #fff; }
.dialogBtns button:hover { background: #e8e8e8; }
.dialogBtns button.primary:hover { background: #0052a3; }

/* ========== Unified View ========== */
#unifiedPanel {
  display: none; flex: 1; overflow: auto; font-family: 'Consolas', 'Courier New', monospace;
  font-size: 14px; line-height: 20px; background: #fff; user-select: text;
}
#unifiedPanel.visible { display: block; }
.unifiedRow { padding: 0 8px; white-space: pre; line-height: 20px; height: 20px; display: flex; }
.unifiedPrefix { width: 20px; text-align: center; flex-shrink: 0; font-weight: bold; }
.unifiedRemoved { background: #ffe6e6; }
.unifiedRemoved .unifiedPrefix { color: #cc0000; }
.unifiedAdded { background: #e6ffe6; }
.unifiedAdded .unifiedPrefix { color: #009900; }
.unifiedSame { }

/* ========== Empty state ========== */
.emptyMsg {
  display: flex; align-items: center; justify-content: center; height: 100%;
  color: #999; font-size: 14px;
}

/* Drop zone highlight */
.dropZone { border: 2px dashed #0066cc !important; background: #e6f0ff !important; }

/* Resizer */
#resizer {
  width: 6px; cursor: col-resize; background: transparent; flex-shrink: 0;
  position: relative; z-index: 10;
}
#resizer:hover, #resizer.active { background: #0066cc; }
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <button id="btnImportA" title="导入左侧文件">导入左文件</button>
  <button id="btnImportB" title="导入右侧文件">导入右文件</button>
  <span class="sep"></span>
  <button id="btnSwap" title="交换左右文件" disabled>交换</button>
  <button id="btnReset" title="重置所有状态到初始" disabled>重置</button>
  <span class="sep"></span>
  <button id="btnFullDiff" title="整体对比两个文件" disabled>整体对比</button>
  <button id="btnSelectRegion" title="进入区域选择模式">选择区域</button>
  <button id="btnExecRegion" title="执行选中区域对比" disabled>执行对比</button>
  <span class="sep"></span>
  <button id="btnPrevDiff" title="上一个差异 (Shift+F7)" disabled>上一差异</button>
  <button id="btnNextDiff" title="下一个差异 (F7)" disabled>下一差异</button>
  <span id="diffCount">未对比</span>
  <span class="sep"></span>
  <label title="左右面板同步滚动"><input type="checkbox" id="chkSyncScroll">同步滚动</label>
  <label title="忽略空行和注释"><input type="checkbox" id="chkIgnoreComments">忽略空行/注释</label>
  <label title="忽略空白字符差异"><input type="checkbox" id="chkIgnoreWhitespace" checked>忽略空白</label>
  <label title="忽略大小写"><input type="checkbox" id="chkIgnoreCase" checked>忽略大小写</label>
  <label title="折叠连续相同行（≥10行）"><input type="checkbox" id="chkFoldSame">折叠相同</label>
  <label title="折叠连续不同行（≥10行）"><input type="checkbox" id="chkFoldDiff">折叠不同</label>
  <span class="sep"></span>
  <button id="btnGotoA" title="跳转到行 (Ctrl+G)">跳转A</button>
  <button id="btnGotoB" title="跳转到行 (Ctrl+G)">跳转B</button>
  <button id="btnUnifiedView" title="切换统一视图" style="margin-left:auto;">统一视图</button>
</div>

<!-- Search Bars -->
<div id="searchRow">
  <div class="searchBar" id="searchBarA">
    <input type="text" id="searchInputA" placeholder="搜索文件A... (Ctrl+F)">
    <label><input type="checkbox" id="chkCaseA">大小写</label>

    <span class="count" id="searchCountA"></span>

  <div class="searchBar" id="searchBarB">
    <input type="text" id="searchInputB" placeholder="搜索文件B... (Ctrl+F)">
    <label><input type="checkbox" id="chkCaseB">大小写</label>
    <button id="btnSearchPrevB">↑</button>
    <button id="btnSearchNextB">↓</button>

<!-- Main Panel: Side-by-side -->

    <div class="panelHeader"><span id="fileNameB">文件B (未导入)</span><span id="lineInfoB"></span></div>
    <div class="panelContent" id="contentB"><div class="emptyMsg">点击"导入右文件"选择.cpp文件，或拖拽文件到此处</div></div>
  </div>
</div>

<!-- Unified View (hidden by default) -->
<div id="unifiedPanel"><div class="emptyMsg">请先执行对比</div></div>

<!-- Region Diff Panel -->
<div id="regionPanel">
  <div id="regionResizer"></div>
  <div class="panelHeader">
    <span>🔍 区域对比结果</span>
    <button id="btnCloseRegion" style="background:#3c3c3c;border:1px solid #555;color:#ccc;cursor:pointer;padding:2px 8px;border-radius:3px;font-size:11px;">关闭</button>

  <div class="panelContent" id="regionContent"></div>
